# Build, test and publish prebuilt binaries for PIE when a version tag is pushed.
#
# Every binary is tested with the full PHP suite before it's packaged as
#   php_rusty_sheet-{version}_php{X.Y}-{arch}-{os}-{libc}-{nts|zts}.zip
# (the names PIE's `pre-packaged-binary` method looks for), attested, and attached
# to a GitHub release for the tag.
name: Release

on:
  push:
    tags: ['*.*.*', 'v*.*.*']
  # Dry runs: build and test every binary without publishing a release.
  pull_request:
    paths: ['.github/workflows/release.yml', 'scripts/release-build.sh']
  workflow_dispatch:

env:
  # Tag pushes name the assets after the tag; dry runs use a placeholder.
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}

permissions:
  contents: read

jobs:
  glibc:
    name: Linux glibc ${{ matrix.arch }}, PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        ts: [nts, zts]
        arch: [x86_64, arm64]
        include:
          # The oldest supported Ubuntu, so the binaries need the oldest glibc.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring, iconv, gd, intl
          tools: composer, phpize, php-config
          coverage: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}
      - uses: dtolnay/rust-toolchain@stable
      # Ubuntu 22.04's libclang 14 can't parse the SSE intrinsics PHP 8.4+'s headers
      # pull in, so bindgen fails; use LLVM 18 (what ubuntu-24.04 ships).
      - name: Install libclang 18
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          sudo bash llvm.sh 18
          sudo apt-get install -y libclang-18-dev
          rm llvm.sh
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"
          # bindgen takes clang's built-in headers (emmintrin.h) from the `clang`
          # binary, which is still 14 on PATH; point it at 18 as well.
          echo "CLANG_PATH=/usr/bin/clang-18" >> "$GITHUB_ENV"
      - name: Build, test, package
        run: ./scripts/release-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: glibc-${{ matrix.arch }}-php${{ matrix.php }}-${{ matrix.ts }}
          path: dist/*.zip

  musl:
    name: Linux musl ${{ matrix.arch }}, PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        ts: [nts, zts]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # The official PHP Alpine images (musl). Run with docker directly: JavaScript
      # actions can't run inside Alpine containers on arm64.
      - name: Build, test, package in php:${{ matrix.php }}-${{ matrix.ts == 'zts' && 'zts' || 'cli' }}-alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e RELEASE_VERSION \
            -e COMPOSER_FLAGS="--ignore-platform-req=ext-gd --ignore-platform-req=ext-intl" \
            "php:${{ matrix.php }}-${{ matrix.ts == 'zts' && 'zts' || 'cli' }}-alpine" sh -euc '
              apk add --no-cache bash build-base clang-dev curl git libzip-dev zip linux-headers
              docker-php-ext-install zip >/dev/null
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="$HOME/.cargo/bin:$PATH"
              curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
              git config --global --add safe.directory /src
              ./scripts/release-build.sh
            '
      - uses: actions/upload-artifact@v4
        with:
          name: musl-${{ matrix.arch }}-php${{ matrix.php }}-${{ matrix.ts }}
          path: dist/*.zip

  publish:
    name: GitHub release
    needs: [glibc, musl]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attest the binaries (PIE can verify them)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -1 dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
